<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<title>登录</title>
		<link rel="stylesheet" href="{$assets}/component/pear/css/pear.css" />
		<link rel="stylesheet" href="{$assets}/admin/css/other/login.css" />
		<link rel="stylesheet" href="{$assets}/admin/css/variables.css" />
		<script>
			if (window.self != window.top) {
				top.location.reload();
			}
		</script>
	</head>

	<body>
		<div class="login-page" style="background-image: url({$assets}/admin/images/background.svg)">
			<div class="layui-row">
				<div class="layui-col-sm6 login-bg layui-hide-xs">
					<img class="login-bg-img" src="{$assets}/admin/images/banner.png" alt="" />
				</div>
				<div class="layui-col-sm6 layui-col-xs12 login-form">
					<form class="layui-form" action="{:store_admin_url('passport/login')}" method="post">
						<div class="form-center">
							<div class="form-center-box">
								<div class="top-log-title">
									<img class="top-log" src="{$assets}/admin/images/logo.png" alt="" />
									<span>LayuiAdmin-Iframe</span>
								</div>
								<div class="top-desc">
									以 超 乎 想 象 的 速 度 构 建 内 部 工 具
								</div>
								<div style="margin-top: 30px">
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-username"></i>
											</div>
											<input
												type="text"
												name="username"
												value=""										
												lay-verify="required"
												placeholder="账户"
												autocomplete="off"
												class="layui-input"
											/>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-password"></i>
											</div>
											<input
												type="password"
												name="password"
												value=""
												lay-verify="required"
												placeholder="密码"
												autocomplete="off"
												class="layui-input"
												lay-affix="eye"
											/>
										</div>
									</div>
									<div class="tab-log-verification">
										<div class="verification-text">
											<div class="layui-input-wrap">
												<div class="layui-input-prefix">
													<i class="layui-icon layui-icon-auz"></i>
												</div>
												<input
													type="text"
													name="captcha"
													lay-verify="required"
													value=""
													placeholder="验证码"
													autocomplete="off"
													class="layui-input"
												/>
											</div>
										</div>
										<img
											src="{:captcha_src()}"
											alt=""
											class="verification-img"
										/>
									</div>
									<div class="layui-form-item">
										<div class="remember-passsword">
											<div class="remember-cehcked">
												<input
													type="checkbox"
													name="like1[write]"
													lay-skin="primary"
													title="自动登录"
												/>
											</div>
										</div>
									</div>
									<div class="login-btn">
										<button
											type="button"
											lay-submit
											lay-filter="login"
											class="layui-btn login"
										>
											登 录
										</button>
									</div>
									<div class="other-login">
										<div class="other-login-methods">其他方式</div>
										<div class="greenText">注册账号</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 资 源 引 入 -->
		<script src="{$assets}/component/layui/layui.js"></script>
		<script src="{$assets}/component/pear/pear.js"></script>
		<script>
			layui.use(['form', 'layer', 'jquery'], function () {
				var form = layui.form;
				var layer = layui.layer;
				var $ = layui.jquery;

				// 登 录 提 交
				form.on('submit(login)', function (data) {
					var loading = layer.load(2);

					$.ajax({
						url: "{:store_admin_url('passport/login')}",
						type: 'post',
						dataType: 'json',
						data: data.field,
						success: function (res) {
							layer.close(loading);

							if (Number(res.code) === 0) {
								layer.msg(res.msg || '登录成功', { icon: 1, time: 800 }, function () {
									location.href = res.url || "{:store_admin_url('index')}";
								});
								return;
							}

							layer.msg(res.msg || '登录失败', { icon: 2 });

							var captcha = $('.verification-img');
							captcha.attr('src', (captcha.attr('src') || '').split('?')[0] + '?t=' + Date.now());
						},
						error: function (xhr) {
							layer.close(loading);

							var msg = xhr.responseJSON && xhr.responseJSON.msg
								? xhr.responseJSON.msg
								: '登录失败，请稍后重试';

							layer.msg(msg, { icon: 2 });
						}
					});

					return false;
				});
			});
		</script>
	</body>
</html>
